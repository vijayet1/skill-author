name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing and staged publishing need a recent npm)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Tests
        run: npm test

      - name: Validate skill and package
        run: npm run validate

      # Stages the release through OIDC (no stored token). It goes live only after a maintainer approves it with 2FA:
      # npmjs.com -> package -> Staged Packages -> Approve, or `npm stage approve <stage-id>`.
      - name: Stage publish with provenance
        run: npm stage publish --access public
